<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f9fafb; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border: 1px solid #e5e7eb; }
        .header { padding: 30px; border-bottom: 1px solid #eee; text-align: center; }
        .content { padding: 30px; }
        .badge { display: inline-block; padding: 4px 12px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 9999px; }
        .footer { padding: 20px; text-align: center; background: #f9fafb; border-top: 1px solid #eee; font-size: 12px; color: #9ca3af; }
        .button { display: inline-block; padding: 12px 24px; background-color: {{ branding.primary_color }}; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; margin: 20px 0; }
        .performer-info { border-top: 1px dashed #e2e8f0; margin-top: 25px; padding-top: 15px; font-size: 13px; color: #64748b; text-align: center; }
        .performer-name { color: #4b5563; font-weight: 700; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            {% if branding.logo_url %}
                <img src="{{ branding.logo_url }}" alt="{{ branding.app_name }} Logo" style="height: 40px; margin-bottom: 20px;">
            {% else %}
                <h2 style="color: {{ branding.primary_color }}; margin: 0 0 20px 0;">{{ branding.app_name }}</h2>
            {% endif %}
            {% block header_content %}{% endblock %}
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; {{ current_year }} {{ branding.app_name }}. All rights reserved.<br>
            {{ translations.disclaimer }}
        </div>
    </div>
</body>
</html>
